name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build Windows x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Bundle FFmpeg sidecar (GPL, offline capability)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          curl.exe -L --retry 3 -o $zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg_extract"
          Expand-Archive -Path $zip -DestinationPath $dir
          $ffmpeg = Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $dir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg 解压失败" }
          New-Item -ItemType Directory -Force -Path "src-tauri/ffmpeg/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "src-tauri/ffmpeg/bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "src-tauri/ffmpeg/bin/ffprobe.exe"
          Write-Output "ffmpeg bundled: $((Get-Item 'src-tauri/ffmpeg/bin/ffmpeg.exe').Length) bytes"

      - name: Build and package installer
        run: bun run build:app
        env:
          CI: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: |
            target/release/bundle/nsis/AudioSeeker_*.exe
            src-tauri/target/release/bundle/nsis/AudioSeeker_*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets/
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          version=$(node -e 'process.stdout.write(require("./src-tauri/tauri.conf.json").version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREV=$(git tag --sort=-version:refname | grep -v "^$TAG$" | head -1 || true)
          if [ -z "$PREV" ]; then PREV=$(git rev-list --max-parents=0 HEAD); fi
          {
            echo "## Release $(date +%Y-%m-%d)"
            echo ""
            git log --pretty='- %s' --no-merges "$PREV..HEAD"
          } > changelog.txt
          cat changelog.txt

      - name: Publish release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          cd assets
          ASSETS=$(find . -type f | tr '\n' ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "==> Release $TAG exists, updating assets and appending changelog"
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --notes-file ../changelog.txt
          else
            echo "==> Creating release $TAG"
            gh release create "$TAG" $ASSETS --title "Cyreneの音频検索器 v${{ steps.version.outputs.version }}" --notes-file ../changelog.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}
